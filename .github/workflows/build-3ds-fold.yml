# Builds the AeonDX APK (Azahar + the 3DS HOME menu, see build.sh) on every
# push to main, or by hand from the Actions tab.
#
# Versions: VERSION holds the release (0.0.1-prerelease0.1, ...).  Each build
# uploads AeonDX-<version>-build<run>.apk as a workflow artifact, and the
# GitHub Release v<version> (a pre-release while the version says
# "prerelease") carries AeonDX-<version>.apk; a rebuild of the same version
# replaces that APK.  Bump VERSION for the next release.  Signed with
# ci/debug.keystore (a fixed debug key, not a secret).
name: Build AeonDX APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# one build at a time: a push while one runs waits (only the newest waits),
# so every build gets to finish instead of racing a dozen others
concurrency:
  group: build-3ds-fold-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
    steps:
      - uses: actions/checkout@v4

      - name: Disk space (Azahar and its submodules are large)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost
          df -h .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-35" "platforms;android-36" "build-tools;36.0.0" \
            "cmake;3.30.3" "ndk;27.3.13750724" "ndk;25.2.9519653" > /dev/null
          # each module picks its own NDK by its ndkVersion (Azahar 27.3, LÖVE 25.2)
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ccache
          echo "NDK_CCACHE=$(which ccache)" >> "$GITHUB_ENV"

      - name: Debug signing key
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.CCACHE_DIR }}
          key: fold3ds-${{ runner.os }}-${{ hashFiles('build.sh', 'azahar/patches/*') }}-${{ github.sha }}
          restore-keys: |
            fold3ds-${{ runner.os }}-${{ hashFiles('build.sh', 'azahar/patches/*') }}-
            fold3ds-${{ runner.os }}-

      - name: Build
        run: ./build.sh

      - name: Collect the APK
        id: apk
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          src=$(ls build/out/*.apk | head -1)
          out="AeonDX-${version}.apk"
          cp "$src" "$out"
          cp "$src" "AeonDX-${version}-build${{ github.run_number }}.apk"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          echo "build=AeonDX-${version}-build${{ github.run_number }}.apk" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *pre*|*alpha*|*beta*) echo "pre=true" >> "$GITHUB_OUTPUT" ;; *) echo "pre=false" >> "$GITHUB_OUTPUT" ;; esac

      - uses: actions/upload-artifact@v4
        with:
          name: AeonDX-${{ steps.apk.outputs.version }}-build${{ github.run_number }}
          path: ${{ steps.apk.outputs.build }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: AeonDX ${{ steps.apk.outputs.version }}
          body: |
            AeonDX ${{ steps.apk.outputs.version }} (build ${{ github.run_number }},
            ${{ github.sha }}).  The 3DS HOME menu with Azahar (3DS), melonDS
            (DS), SkyEmu (GB / GBC / GBA), Eden (Switch) and the gen1recomp
            Pokémon games.  Download the .apk below on the phone and install it.
            App id com.nahalewski.aeondx.
          files: ${{ steps.apk.outputs.file }}
          prerelease: ${{ steps.apk.outputs.pre }}
          make_latest: ${{ steps.apk.outputs.pre == 'true' && 'false' || 'true' }}
